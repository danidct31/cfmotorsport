# IMPORTANT: In Railway → this service → Settings → Root Directory = api
[build]
builder = "NIXPACKS"
buildCommand = "(npm ci || npm install) && npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && npx prisma db seed && node dist/main"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
